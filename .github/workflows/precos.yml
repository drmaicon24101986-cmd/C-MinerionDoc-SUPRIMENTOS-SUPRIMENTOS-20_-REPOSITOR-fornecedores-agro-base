name: Precos oficiais (IMEA, Cepea e Conab)
# IMEA: cotacoes publicas por regiao de MT (soja, milho, algodao, boi) - uso interno, ver termo de uso do IMEA.
# Cepea: indicadores diarios (soja Paranagua, milho Campinas) lidos da pagina publica com navegador.
# Conab: precos ao produtor (portal novo) - o robo tambem registra os enderecos que o portal usa.
# Tudo e salvo em data/precos/ neste repositorio.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 11 * * 1-5"

permissions:
  contents: write

jobs:
  precos:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Preparar
        run: |
          pip install playwright==1.47.0
          python3 -m playwright install --with-deps chromium
          mkdir -p data/precos
      - name: IMEA (API publica)
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import json, urllib.request, time
          H = {"User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64)", "Accept": "application/json"}
          out = {}
          for nome, cid in [("soja", 4), ("milho", 3), ("algodao", 1), ("boi", 2)]:
              r = {}
              for tipo in ("cotacoes", "indicadores"):
                  u = f"https://api1.imea.com.br/api/v2/mobile/cadeias/{cid}/{tipo}"
                  try:
                      with urllib.request.urlopen(urllib.request.Request(u, headers=H), timeout=120) as resp:
                          r[tipo] = json.loads(resp.read().decode("utf-8"))
                  except Exception as e:
                      r[tipo] = {"erro": str(e)}
                  time.sleep(1)
              out[nome] = r
              print(nome, {k: (len(v) if isinstance(v, list) else v) for k, v in r.items()})
          json.dump(out, open("data/precos/imea.json", "w"), ensure_ascii=False)
          PYEOF
      - name: Cepea e Conab (navegador)
        continue-on-error: true
        run: |
          python3 - <<'PYEOF'
          import json, re, datetime
          from playwright.sync_api import sync_playwright
          res = {"cepea": {}, "conab_requisicoes": []}
          with sync_playwright() as p:
              b = p.chromium.launch()
              ctx = b.new_context(user_agent="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/128.0 Safari/537.36", locale="pt-BR")
              pg = ctx.new_page()
              for nome, url in [("soja_paranagua", "https://www.cepea.org.br/br/indicador/soja.aspx"), ("milho", "https://www.cepea.org.br/br/indicador/milho.aspx"), ("boi", "https://www.cepea.org.br/br/indicador/boi-gordo.aspx")]:
                  try:
                      pg.goto(url, timeout=90000); pg.wait_for_selector("table", timeout=90000)
                      tabs = pg.eval_on_selector_all("table", "ts => ts.slice(0,3).map(t => [...t.rows].slice(0,12).map(r => [...r.cells].map(c => c.innerText.trim())))")
                      res["cepea"][nome] = tabs
                      print("cepea", nome, tabs[0][:3] if tabs else "sem tabela")
                  except Exception as e:
                      res["cepea"][nome] = {"erro": str(e)[:300]}; print("cepea", nome, "erro", str(e)[:200])
              reqs = []
              pg2 = ctx.new_page()
              pg2.on("request", lambda r: reqs.append([r.method, r.url, (r.post_data or "")[:500]]) if r.resource_type in ("xhr", "fetch") else None)
              try:
                  pg2.goto("https://consultaprecosdemercado.conab.gov.br/#/home", timeout=90000)
                  pg2.wait_for_timeout(15000)
                  res["conab_texto"] = pg2.inner_text("body")[:3000]
              except Exception as e:
                  res["conab_erro"] = str(e)[:300]
              res["conab_requisicoes"] = reqs[:80]
              print("conab requisicoes:", len(reqs)); [print(r[:2]) for r in reqs[:40]]
              b.close()
          res["atualizado"] = datetime.datetime.utcnow().isoformat() + "Z"
          json.dump(res, open("data/precos/cepea_conab.json", "w"), ensure_ascii=False, indent=1)
          PYEOF
      - name: Salvar no repositorio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -q --ignore-unmatch data/precos/*.tsv.gz data/precos/log.json
          git add data/precos
          git commit -m "Precos oficiais $(date +%Y-%m-%d)" || echo "sem mudancas"
          git push
